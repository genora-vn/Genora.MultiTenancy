# ============================================================
# Mini-App tenants qua YARP Gateway (rate-limit) — PRODUCTION
# Ingress THUC TE tren production la XAMPP Apache (giu cong 103.157.218.191:443), KHONG phai IIS.
#
# CHEN 2 BLOCK NAY VAO  C:\xampp\apache\conf\extra\httpd-vhost.conf
# NGAY TRUOC vhost wildcard "tenant-proxy.genora.vn" (ServerAlias *.genora.vn).
# ServerName cu the se thang wildcard ServerAlias.
#
# Luong:
#   public /api/mini-app/hl25|hlg  -> YARP gateway 127.0.0.1:5088 (rate-limit + inject key) -> ABP 8868
#   admin  /api/mini-app/.../admin -> ABP 103.157.218.174:8868 (bypass gateway, giu auth)
#   con lai (static, account, /api/mini-app/hl Sales, signalr) -> ABP 103.157.218.174:8868
#   goi cheo host (hl25 tren hoalinh, hlg tren duocpham) -> 404
# ============================================================

# --- Duoc pham Hoa Linh (HL25) : duocpham-hoalinh.genora.vn ---
<VirtualHost 103.157.218.191:443>
    ServerName duocpham-hoalinh.genora.vn

    SSLEngine on
    SSLCertificateFile      "C:/xampp/apache/crt/Genora/star_genora_vn_cert.pem"
    SSLCertificateKeyFile   "C:/xampp/apache/crt/Genora/genora.key"
    SSLCertificateChainFile "C:/xampp/apache/crt/Genora/ChainCA.crt"

    # Reject cross-host: hlg khong thuoc host nay
    RewriteEngine On
    RewriteRule "^/api/mini-app/hlg(/|$)" - [R=404,L]

    ProxyPreserveHost On
    ProxyAddHeaders Off
    SSLProxyEngine On

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "%{HTTP_HOST}s"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"

    # 1) Admin -> ABP truc tiep (bypass gateway)
    ProxyPass        /api/mini-app/hl25/admin http://103.157.218.174:8868/api/mini-app/hl25/admin retry=0 timeout=600 keepalive=On
    ProxyPassReverse /api/mini-app/hl25/admin http://103.157.218.174:8868/api/mini-app/hl25/admin

    # 2) Public HL25 -> YARP gateway (rate-limit)
    ProxyPass        /api/mini-app/hl25 http://127.0.0.1:5088/api/mini-app/hl25 retry=0 timeout=600 keepalive=On
    ProxyPassReverse /api/mini-app/hl25 http://127.0.0.1:5088/api/mini-app/hl25

    # 3) SignalR -> ABP
    ProxyPass        /signalr-hubs/ ws://103.157.218.174:8868/signalr-hubs/ retry=0 timeout=600 keepalive=On
    ProxyPassReverse /signalr-hubs/ ws://103.157.218.174:8868/signalr-hubs/

    # 4) Con lai -> ABP
    ProxyPass        / http://103.157.218.174:8868/ retry=0 timeout=600 keepalive=On
    ProxyPassReverse / http://103.157.218.174:8868/

    ErrorLog  "logs/duocpham-hoalinh.genora.vn-ssl-error.log"
    CustomLog "logs/duocpham-hoalinh.genora.vn-ssl-access.log" common
</VirtualHost>

# --- Hoa Linh Mien Nam (HLG + HL Sales) : hoalinh.genora.vn ---
<VirtualHost 103.157.218.191:443>
    ServerName hoalinh.genora.vn

    SSLEngine on
    SSLCertificateFile      "C:/xampp/apache/crt/Genora/star_genora_vn_cert.pem"
    SSLCertificateKeyFile   "C:/xampp/apache/crt/Genora/genora.key"
    SSLCertificateChainFile "C:/xampp/apache/crt/Genora/ChainCA.crt"

    # Reject cross-host: hl25 khong thuoc host nay
    RewriteEngine On
    RewriteRule "^/api/mini-app/hl25(/|$)" - [R=404,L]

    ProxyPreserveHost On
    ProxyAddHeaders Off
    SSLProxyEngine On

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "%{HTTP_HOST}s"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"

    # 1) HLG Admin -> ABP truc tiep (bypass gateway)
    ProxyPass        /api/mini-app/hlg/admin http://103.157.218.174:8868/api/mini-app/hlg/admin retry=0 timeout=600 keepalive=On
    ProxyPassReverse /api/mini-app/hlg/admin http://103.157.218.174:8868/api/mini-app/hlg/admin

    # 2) Public HLG -> YARP gateway (rate-limit)
    ProxyPass        /api/mini-app/hlg http://127.0.0.1:5088/api/mini-app/hlg retry=0 timeout=600 keepalive=On
    ProxyPassReverse /api/mini-app/hlg http://127.0.0.1:5088/api/mini-app/hlg

    # 3) SignalR (HLG live-feed) -> ABP
    ProxyPass        /signalr-hubs/ ws://103.157.218.174:8868/signalr-hubs/ retry=0 timeout=600 keepalive=On
    ProxyPassReverse /signalr-hubs/ ws://103.157.218.174:8868/signalr-hubs/

    # 4) Con lai (static, account, /api/mini-app/hl Sales) -> ABP
    ProxyPass        / http://103.157.218.174:8868/ retry=0 timeout=600 keepalive=On
    ProxyPassReverse / http://103.157.218.174:8868/

    ErrorLog  "logs/hoalinh.genora.vn-ssl-error.log"
    CustomLog "logs/hoalinh.genora.vn-ssl-access.log" common
</VirtualHost>
